[workspace]
resolver = "3"
# Native programs own their manifests in app/ and bootstrap/stage1/.
# Both share SDK delivery and dependency resolution with the libraries in lib/.
members = [
    "*",
    "../bootstrap/stage1/console-input",
    "../bootstrap/stage1/console-output",
    "../bootstrap/stage1/fs-backend",
    "../bootstrap/stage1/fs-erofs",
    "../bootstrap/stage1/fs-fat",
    "../bootstrap/stage1/init",
    "../bootstrap/stage1/io-runtime",
    "../bootstrap/stage1/mount",
    "../bootstrap/stage1/session",
    "../bootstrap/stage1/fallback-sh",
    "../bootstrap/stage1/umount",
    "../lib/clap",
    "../lib/fs-service",
    "../lib/service-manager",
    "../lib/tool-args",
    "../lib/tool-args/shared",
    "../lib/rust-std",
    "../lib/vm-policy",
    "../lib/vm-policy/shared",
    "../lib/vm-support",
    "../lib/vm-support/shared",
]
exclude = [".cargo", "target"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/roolrz/HypeR"
publish = false

[workspace.dependencies]
hyper-clap-shared = { path = "../lib/clap" }
hyper-rust-std = { path = "../lib/rust-std" }
hyper-tool-args = { path = "../lib/tool-args" }
hyper-tool-args-shared = { path = "../lib/tool-args/shared" }
hyper-os = "=0.0.0"
hyper-block = "=0.0.0"
hyper-filesystem = "=0.0.0"
hyper-fatfs = "=0.0.0"
hyper-erofs = "=0.0.0"
hyper-fs-service = { path = "../lib/fs-service" }
hyper-service-manager = { path = "../lib/service-manager", default-features = false }
hyper-rt = { version = "=0.0.0", features = ["std"] }
hyper-service = "=0.0.0"
hyper-vm-image = "=0.0.0"
hyper-vm-policy = { path = "../lib/vm-policy" }
hyper-vm-policy-shared = { path = "../lib/vm-policy/shared" }
hyper-vm-support = { path = "../lib/vm-support" }
hyper-vm-support-shared = { path = "../lib/vm-support/shared" }
clap = { version = "=4.6.6", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[workspace.lints.clippy]
doc_markdown = "deny"
empty_docs = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
undocumented_unsafe_blocks = "deny"
unimplemented = "deny"
unreachable = "deny"
unwrap_used = "deny"
missing_safety_doc = "deny"

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("hyper"))'] }
unsafe_op_in_unsafe_fn = "deny"

[profile.release]
codegen-units = 1
debug = 1
incremental = false
lto = "fat"
opt-level = "s"
overflow-checks = true
panic = "abort"
strip = "none"
