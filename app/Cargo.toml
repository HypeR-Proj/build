[package]
name = "hyper-app"
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/roolrz/HypeR"
publish = false
description = "HypeR Native bootstrap services and init supervisor"

[lib]
path = "init/src/lib.rs"

[[bin]]
name = "hyper-init"
path = "init/src/main.rs"
test = false
bench = false

[[bin]]
name = "hyper-session-service"
path = "session/src/main.rs"
test = false
bench = false

[[bin]]
name = "hyper-console-input"
path = "console/input.rs"
test = false
bench = false

[[bin]]
name = "hyper-console-output"
path = "console/output.rs"
test = false
bench = false

[[bin]]
name = "hyper-shell"
path = "shell/main.rs"
test = false
bench = false

[[bin]]
name = "hyper-echo"
path = "command/echo.rs"
test = false
bench = false

[[bin]]
name = "hyper-ps"
path = "command/ps.rs"
test = false
bench = false

[[bin]]
name = "hyper-handle"
path = "command/handle.rs"
test = false
bench = false

[[bin]]
name = "hyper-ls"
path = "command/ls.rs"
test = false
bench = false

[[bin]]
name = "hyper-free"
path = "command/free.rs"
test = false
bench = false

[[bin]]
name = "hyper-top"
path = "command/top.rs"
test = false
bench = false

[dependencies]
hyper-os = "=0.0.0"
hyper-rt = "=0.0.0"
hyper-service = "=0.0.0"

[lints.clippy]
doc_markdown = "deny"
empty_docs = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
undocumented_unsafe_blocks = "deny"
unimplemented = "deny"
unreachable = "deny"
unwrap_used = "deny"
missing_safety_doc = "deny"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[profile.release]
codegen-units = 1
debug = 1
incremental = false
lto = "thin"
opt-level = "s"
overflow-checks = true
panic = "abort"
strip = "none"
